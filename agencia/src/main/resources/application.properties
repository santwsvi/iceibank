# ICEIBank - Agencia (Sprint 1)
# A porta e o id da agencia sao definidos via variavel de ambiente / argumento de linha de comando:
#   AGENCIA_ID=0  -> porta 4000+OFFSET
#   AGENCIA_ID=1  -> porta 4001+OFFSET
#   AGENCIA_ID=2  -> porta 4002+OFFSET
# Veja com.iceibank.config.AppConfig

server.port=${PORTA:4000}
spring.application.name=iceibank-agencia

# Chave secreta usada para assinar os JWTs.
# ATENCAO: troque isso em producao / nao commite chaves reais. Aqui e apenas para fins didaticos.
iceibank.jwt.secret=${JWT_SECRET:chave-secreta-super-longa-para-o-iceibank-sprint1-trocar-em-producao-0123456789}
iceibank.jwt.expiracao-minutos=${JWT_EXP_MIN:15}

# Segredo compartilhado para chamadas internas agencia-a-agencia (creditar-remoto).
# Nao e o mesmo segredo do JWT de usuario - ver SecurityConfig / RESPOSTAS.md.
iceibank.internal.secret=${INTERNAL_SECRET:segredo-interno-entre-agencias-sprint1}

logging.level.com.iceibank=INFO
